[package]
name = "mentalcalc-android"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
name = "mentalcalc_android"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
mentalcalc-core = { path = "../mentalcalc-core" }
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rand = "0.9.5"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
libc = "0.2.191"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
